# Dependabot — frozen repository.
#
# B.O.A.R.D is a finished showcase (see README and ROADMAP.md), so routine
# version-update PRs are switched off: `open-pull-requests-limit: 0` disables
# version updates for each ecosystem. Security updates are unaffected by this
# limit; Dependabot still opens those when an advisory hits a dependency,
# provided "Dependabot security updates" is enabled in the repository settings.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#open-pull-requests-limit
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
