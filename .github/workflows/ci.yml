name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:coverage -- --ci

  # Hard CI gate for Month 3 (multi-tenancy): cross-workspace isolation must hold.
  rules-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Firestore emulator runs on the JVM.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # firebase-tools v15+ (the Firestore emulator runtime) requires JDK 21+.
          java-version: 21

      - run: npm ci

      - name: Firestore rules tests
        run: npm run test:rules

  # Month 4 (Phase 1): the Cloud Functions AI gateway is a second test + build
  # surface. Builds the TS (catches type errors the root tsc skips via exclude)
  # and runs the gateway unit tests (prompt assembly, rate-limit math, handler guards).
  functions:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: Type check + build
        run: npm run build

      - name: Test
        run: npm test
